name: Binary Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - "v*"
  release:
    types:
      - published
      - prereleased

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEV_RELEASE_TAG: dev-builds
      DEV_MANIFEST_BRANCH: dev-build-manifest
      DEV_MANIFEST_PATH: dev-builds.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build Dashboard
        working-directory: dashboard
        env:
          VITE_BASE_API: "/api/"
        run: |
          npm ci
          npm run build
          cp ./build/index.html ./build/404.html
          mkdir -p ../internal/gateway/static/dashboard/build
          cp -R ./build/. ../internal/gateway/static/dashboard/build/

      - name: Validate installer shell scripts
        shell: bash
        run: bash -n scripts/nora/nora-binary.sh scripts/nora/nora.sh scripts/nora/nora-node-binary.sh scripts/nora/nora-node.sh

      - name: Test Go
        run: go test ./internal/app/system ./internal/app/migrations

      - name: Build and Package Binaries
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          build_tag="dev-${GITHUB_SHA::7}"
          mkdir -p dist dev-upload-assets release-upload-assets

          for arch in amd64 arm64; do
            echo "--- Building Linux ${arch} ---"
            rm -rf dist/*
            GOOS=linux GOARCH="${arch}" bash scripts/build_binary.sh
            asset_name="nora-linux-${arch}.tar.gz"
            tar -C dist -czf "dist/${asset_name}" nora-server nora-cli templates
            sha256sum "dist/${asset_name}"
            cp "dist/${asset_name}" "dev-upload-assets/nora-linux-${arch}-${build_tag}.tar.gz"
            cp "dist/${asset_name}" "release-upload-assets/${asset_name}"
          done

          echo "--- Building Windows amd64 ---"
          rm -rf dist/*
          GOOS=windows GOARCH=amd64 bash scripts/build_binary.sh
          (cd dist && zip -q -r nora-windows-amd64.zip nora-server.exe nora-cli.exe templates)
          sha256sum dist/nora-windows-amd64.zip
          cp dist/nora-windows-amd64.zip "dev-upload-assets/nora-windows-amd64-${build_tag}.zip"
          cp dist/nora-windows-amd64.zip "release-upload-assets/nora-windows-amd64.zip"

          echo "build_tag=${build_tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish Dev Release
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${DEV_RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${DEV_RELEASE_TAG}" \
              --title "Nora dev binary builds" \
              --notes "Rolling prerelease that stores Nora dev binary build assets." \
              --prerelease \
              --target "${GITHUB_SHA}"
          gh release upload "${DEV_RELEASE_TAG}" dev-upload-assets/* --clobber

      - name: Update Dev Build Manifest
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${DEV_MANIFEST_BRANCH}:refs/remotes/origin/${DEV_MANIFEST_BRANCH}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${DEV_MANIFEST_BRANCH}"; then
            git worktree add dev-manifest "origin/${DEV_MANIFEST_BRANCH}"
          else
            git worktree add --detach dev-manifest
            git -C dev-manifest switch --orphan "${DEV_MANIFEST_BRANCH}"
            git -C dev-manifest rm -rf . >/dev/null 2>&1 || true
          fi

          manifest_path="dev-manifest/${DEV_MANIFEST_PATH}"
          mkdir -p "$(dirname "${manifest_path}")"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          previous_manifest='{}'
          if [ -s "${manifest_path}" ]; then
            previous_manifest="$(<"${manifest_path}")"
          fi

          jq -n \
            --argjson previous "${previous_manifest}" \
            --arg project "Nora" \
            --arg build_tag "${{ steps.meta.outputs.build_tag }}" \
            --arg sha "${GITHUB_SHA}" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_number "${GITHUB_RUN_NUMBER}" \
            --arg generated_at "${generated_at}" \
            --arg release_tag "${DEV_RELEASE_TAG}" \
            --arg download_base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${DEV_RELEASE_TAG}" \
            --argjson asset_names "$(find dev-upload-assets -maxdepth 1 -type f -printf '%f\n' | jq -R . | jq -s .)" \
            '
              def build_assets($names):
                reduce $names[]? as $name
                  ({};
                    if ($name | test("^nora-(?<platform>(linux|windows)-[A-Za-z0-9_]+)-dev-[0-9a-fA-F]+(\\.tar\\.gz|\\.zip)$")) then
                      ($name | capture("^nora-(?<platform>(linux|windows)-[A-Za-z0-9_]+)-dev-[0-9a-fA-F]+(\\.tar\\.gz|\\.zip)$")) as $match
                      | .[$match.platform] = {name: $name, url: ($download_base + "/" + $name)}
                    else
                      .
                    end);
              def legacy_builds:
                if (.latest? | type) == "object" then
                  .latest as $legacy
                  | [{
                      tag: ($legacy.build_tag // $legacy.tag // ""),
                      sha: ($legacy.sha // ""),
                      branch: ($legacy.branch // "dev"),
                      workflow: ($legacy.workflow // ""),
                      run_id: ($legacy.run_id // ""),
                      run_number: ($legacy.run_number // ""),
                      created_at: ($legacy.generated_at // $legacy.created_at // ""),
                      assets: build_assets($legacy.assets // [])
                    } | select(.tag != "" and (.assets | length) > 0)]
                else
                  []
                end;
              ($previous | ((.builds // []) + legacy_builds)) as $previous_builds
              | {
                  schema_version: 1,
                  project: $project,
                  latest: $build_tag,
                  updated_at: $generated_at,
                  builds: (
                    ([{
                      tag: $build_tag,
                      sha: $sha,
                      branch: $branch,
                      workflow: $workflow,
                      run_id: $run_id,
                      run_number: $run_number,
                      created_at: $generated_at,
                      release_tag: $release_tag,
                      assets: build_assets($asset_names)
                    }] + $previous_builds)
                    | reduce .[] as $build
                        ([];
                          if (($build.tag // "") == "" or any(.[]; (.tag // "") == ($build.tag // ""))) then
                            .
                          else
                            . + [$build]
                          end)
                    | .[:50]
                  )
                }
            ' > "${manifest_path}"

          git -C dev-manifest add "${DEV_MANIFEST_PATH}"
          if ! git -C dev-manifest diff --cached --quiet; then
            git -C dev-manifest config user.name "github-actions[bot]"
            git -C dev-manifest config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C dev-manifest commit -m "Update dev binary build manifest [skip ci]"
            for attempt in 1 2 3 4; do
              if git -C dev-manifest push origin "HEAD:${DEV_MANIFEST_BRANCH}"; then
                break
              fi
              git -C dev-manifest fetch origin "${DEV_MANIFEST_BRANCH}"
              git -C dev-manifest rebase "origin/${DEV_MANIFEST_BRANCH}" || git -C dev-manifest rebase --abort
            done
          fi

      - name: Publish Stable Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME}"
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes "Nora Release ${RELEASE_TAG}"
          gh release upload "${RELEASE_TAG}" release-upload-assets/* --clobber
